# AssureWallos: Images nach Docker Hub (bkunzmann/assurewallos).
# Branch: feature/insurance-core | Release: Git-Tag v* (z. B. v0.1.2)
name: AssureWallos Docker

on:
  push:
    branches:
      - feature/insurance-core
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_latest:
        description: "Zusätzlich :latest setzen (empfohlen bei Release-Tags)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: bkunzmann/assurewallos

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=feature-insurance-core,enable=${{ github.ref == 'refs/heads/feature/insurance-core' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/feature/insurance-core' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || github.event.inputs.tag_latest != 'false') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
